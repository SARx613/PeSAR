<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PeSAR — API</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1c1c1e;
      border: 1px solid #38383a;
      border-radius: 20px;
      padding: 40px;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }
    h1 { font-size: 2rem; font-weight: 700; letter-spacing: -1px; margin-bottom: 8px; }
    .accent { color: #0a84ff; }
    p { color: #636366; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
    .endpoints { text-align: left; background: #0d0d0f; border-radius: 12px; padding: 16px; }
    .endpoint { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #38383a; }
    .endpoint:last-child { border-bottom: none; }
    .method { background: #0a84ff22; color: #0a84ff; font-size: 11px; font-weight: 700;
              padding: 2px 8px; border-radius: 6px; font-family: monospace; min-width: 40px; text-align: center; }
    .path { font-family: monospace; font-size: 13px; color: #ebebf5cc; }
    .badge { margin-top: 24px; font-size: 12px; color: #636366; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pe<span class="accent">SAR</span></h1>
    <p>Backend API — Taux de change EUR → ARS (Western Union)<br/>Appelé automatiquement toutes les 15 min par GitHub Actions.</p>

    <div class="endpoints">
      <div class="endpoint">
        <span class="method">GET</span>
        <span class="path">/api/latest-rate</span>
      </div>
      <div class="endpoint">
        <span class="method">GET</span>
        <span class="path">/api/rate-history</span>
      </div>
      <div class="endpoint">
        <span class="method">POST</span>
        <span class="path">/api/register-token</span>
      </div>
      <div class="endpoint">
        <span class="method">GET</span>
        <span class="path">/api/scrape-rate 🔒</span>
      </div>
    </div>

    <p class="badge">🔒 /api/scrape-rate nécessite un header Authorization</p>
  </div>
</body>
</html>
