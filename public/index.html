<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PeSAR — EUR → ARS</title>
  <link rel="icon" type="image/png" href="logo-dark.png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" href="logo-light.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" href="logo-dark.png" />
  <script>
    // Some browsers ignore media queries on <link rel="icon">.
    // This keeps the favicon in sync with the OS theme.
    (() => {
      const darkHref = "logo-dark.png";
      const lightHref = "logo-light.png";
      const mql = window.matchMedia?.("(prefers-color-scheme: light)");

      const ensureFaviconLink = () => {
        let link =
          document.querySelector('link[rel="icon"][data-dynamic="true"]') ||
          document.querySelector('link[rel="icon"]:not([media])');

        if (!link) {
          link = document.createElement("link");
          link.rel = "icon";
          link.type = "image/png";
          document.head.appendChild(link);
        }

        link.setAttribute("data-dynamic", "true");
        link.href = mql?.matches ? lightHref : darkHref;
      };

      ensureFaviconLink();
      mql?.addEventListener?.("change", ensureFaviconLink);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:           #06061a;
      --bg2:          #0d0d2b;
      --card:         rgba(255,255,255,0.04);
      --card-border:  rgba(255,255,255,0.08);
      --text:         #ffffff;
      --text-muted:   rgba(255,255,255,0.45);
      --text-soft:    rgba(255,255,255,0.7);
      --accent:       #2979ff;
      --accent-glow:  rgba(41,121,255,0.35);
      --accent2:      #00d2ff;
      --up:           #00e676;
      --up-bg:        rgba(0,230,118,0.12);
      --down:         #ff1744;
      --down-bg:      rgba(255,23,68,0.12);
      --neutral:      rgba(255,255,255,0.3);
      --neutral-bg:   rgba(255,255,255,0.06);
      --btn-active:   rgba(41,121,255,0.18);
      --shadow:       0 20px 60px rgba(0,0,0,0.6);
      --radius:       20px;
      --chart-line:   #2979ff;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg:           #eef2ff;
        --bg2:          #e8edff;
        --card:         rgba(255,255,255,0.75);
        --card-border:  rgba(41,121,255,0.15);
        --text:         #0a0a2e;
        --text-muted:   rgba(10,10,46,0.45);
        --text-soft:    rgba(10,10,46,0.7);
        --accent:       #1a5fff;
        --accent-glow:  rgba(26,95,255,0.2);
        --accent2:      #0099cc;
        --up:           #00a94f;
        --up-bg:        rgba(0,169,79,0.1);
        --down:         #d50032;
        --down-bg:      rgba(213,0,50,0.1);
        --neutral:      rgba(10,10,46,0.35);
        --neutral-bg:   rgba(10,10,46,0.06);
        --btn-active:   rgba(26,95,255,0.12);
        --shadow:       0 20px 60px rgba(41,121,255,0.12);
        --chart-line:   #1a5fff;
      }
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    /* ── Hide scrollbar everywhere, keep scroll functional ── */
    html, body {
      scrollbar-width: none;        /* Firefox */
      -ms-overflow-style: none;     /* IE / Edge legacy */
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar { display: none; } /* Chrome / Safari / WebKit */

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Animated background ── */
    .bg-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .bg-mesh::before,
    .bg-mesh::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.25;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .bg-mesh::before {
      width: 70vw; height: 70vw;
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      top: -20%; left: -20%;
      animation-duration: 22s;
    }
    .bg-mesh::after {
      width: 55vw; height: 55vw;
      background: radial-gradient(circle, var(--accent2) 0%, transparent 70%);
      bottom: -15%; right: -15%;
      animation-duration: 16s;
      animation-delay: -8s;
    }

    @media (prefers-color-scheme: light) {
      .bg-mesh::before { opacity: 0.12; }
      .bg-mesh::after  { opacity: 0.10; }
    }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(5%, 8%) scale(1.1); }
      100% { transform: translate(-3%, 5%) scale(0.95); }
    }

    /* ── Grid lines ── */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(var(--card-border) 1px, transparent 1px),
        linear-gradient(90deg, var(--card-border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.4;
    }
    @media (prefers-color-scheme: light) { .bg-grid { opacity: 0.25; } }

    /* ── Layout ── */
    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo img {
      height: 44px;
      width: auto;
      display: block;
      border-radius: 14px;
    }
    .logo-text {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      line-height: 1;
      user-select: none;
      -webkit-user-select: none;
    }
    .logo-text span { color: var(--accent); }
    .logo .logo-dark  { display: block; }
    .logo .logo-light { display: none; }
    @media (prefers-color-scheme: light) {
      .logo .logo-dark  { display: none; }
      .logo .logo-light { display: block; }
    }

    .wu-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 50px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-soft);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .wu-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--up);
      box-shadow: 0 0 8px var(--up);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.85); }
    }

    /* ── Hero rate ── */
    .hero {
      text-align: center;
      margin-bottom: 40px;
    }
    .hero-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .hero-rate {
      font-size: clamp(52px, 13vw, 88px);
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 1;
      background: linear-gradient(135deg, var(--text) 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 14px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-rate.loading {
      background: var(--card);
      -webkit-background-clip: unset;
      background-clip: unset;
      -webkit-text-fill-color: transparent;
      border-radius: 16px;
      animation: shimmer 1.6s ease-in-out infinite;
      width: 380px;
      max-width: 90%;
      margin: 0 auto 14px;
    }
    @keyframes shimmer {
      0%   { opacity: 0.5; }
      50%  { opacity: 0.9; }
      100% { opacity: 0.5; }
    }
    .hero-sub {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hero-change {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 16px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 50px;
    }
    .hero-change.up   { color: var(--up);   background: var(--up-bg); }
    .hero-change.down { color: var(--down); background: var(--down-bg); }
    .hero-change.neutral { color: var(--neutral); background: var(--neutral-bg); }
    .hero-time {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ── Card glass ── */
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* ── Time range buttons ── */
    .range-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .range-bar::-webkit-scrollbar { display: none; }

    .range-btn {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 7px 14px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-soft);
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .range-btn:hover {
      border-color: var(--accent);
      color: var(--text);
      background: var(--btn-active);
    }
    .range-btn.active {
      background: var(--btn-active);
      border-color: var(--accent);
      color: var(--text);
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .range-pct {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.2px;
    }
    .range-pct.up   { color: var(--up);   background: var(--up-bg); }
    .range-pct.down { color: var(--down); background: var(--down-bg); }
    .range-pct.neutral { color: var(--neutral); background: var(--neutral-bg); }
    .range-pct.loading-pct {
      color: transparent;
      background: var(--neutral-bg);
      min-width: 36px;
      animation: shimmer 1.6s ease-in-out infinite;
    }

    /* ── Chart ── */
    .chart-wrap {
      padding: 20px 16px 8px;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }
    .chart-wrap canvas { max-height: 280px; }

    .chart-overlay {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
    }
    .chart-overlay.visible { display: flex; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--card-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .chart-empty-msg {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* ── Chart stats bar ── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      border-top: 1px solid var(--card-border);
      background: var(--card-border);
    }
    .stat-item {
      background: var(--bg);
      padding: 14px 16px;
      text-align: center;
    }
    @media (prefers-color-scheme: light) {
      .stat-item { background: rgba(255,255,255,0.6); }
    }
    .stat-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .stat-value.up   { color: var(--up); }
    .stat-value.down { color: var(--down); }

    /* ── Currency Converter ── */
    .converter-card {
      margin-bottom: 20px;
    }
    .converter-inner {
      padding: 20px 24px 22px;
    }
    .converter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .converter-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .converter-rate-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(41,121,255,0.12);
      padding: 3px 10px;
      border-radius: 50px;
      font-variant-numeric: tabular-nums;
    }
    .converter-inputs {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .converter-field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .converter-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .converter-label .flag { font-size: 14px; }
    .converter-input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      padding: 11px 14px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      text-align: right;
      outline: none;
      transition: border-color 0.2s ease;
      font-variant-numeric: tabular-nums;
    }
    .converter-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .converter-input::placeholder { color: var(--text-muted); }
    @media (prefers-color-scheme: light) {
      .converter-input { background: rgba(10,10,46,0.04); }
    }
    .converter-swap {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 22px;
      padding: 0 4px 10px;
      color: var(--accent);
      transition: transform 0.35s ease;
      line-height: 1;
    }
    .converter-swap:hover { transform: rotate(180deg); }

    /* ── Chart range comparison overlay ── */
    #comparison-bar {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid var(--card-border);
      flex-wrap: wrap;
    }
    #comparison-bar.visible { display: flex; }
    .cmp-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .cmp-chip {
      font-size: 15px;
      font-weight: 800;
      padding: 5px 14px;
      border-radius: 50px;
      font-variant-numeric: tabular-nums;
    }
    .cmp-chip.up   { color: var(--up);   background: var(--up-bg); }
    .cmp-chip.down { color: var(--down); background: var(--down-bg); }
    .cmp-hint {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      padding: 6px 16px 10px;
      border-top: 1px solid var(--card-border);
    }
    /* drag crosshair lines on chart — positioned via JS to align exactly with chartCanvas */
    #chart-drag-overlay {
      position: absolute;
      pointer-events: none;
      z-index: 2;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    footer a:hover { text-decoration: underline; }
    .footer-sep { opacity: 0.3; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .wrapper { padding: 20px 14px 50px; }
      header { margin-bottom: 24px; }
      .hero { margin-bottom: 28px; }
      .stats-bar { grid-template-columns: repeat(3, 1fr); }
      .stat-item { padding: 12px 10px; }
      .stat-value { font-size: 14px; }
      .chart-wrap canvas { max-height: 220px; }
    }
    @media (max-width: 360px) {
      .stats-bar { grid-template-columns: 1fr 1fr; }
      .stat-item:last-child { grid-column: span 2; }
    }

    /* ── Error toast ── */
    #error-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(255,23,68,0.15);
      border: 1px solid rgba(255,23,68,0.3);
      color: var(--down);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(12px);
      transition: transform 0.3s ease;
      z-index: 100;
      white-space: nowrap;
    }
    #error-toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="bg-grid"></div>

  <div class="wrapper">

    <!-- Header -->
    <header>
      <div class="logo">
        <img class="logo-dark"  src="logo-dark.png"  alt="PeSAR" />
        <img class="logo-light" src="logo-light.png" alt="PeSAR" />
        <div class="logo-text">Pe<span>SAR</span></div>
      </div>
      <div class="wu-badge">
        <div class="wu-dot"></div>
        Western Union
      </div>
    </header>

    <!-- Hero rate -->
    <section class="hero">
      <div class="hero-label">1 EUR en pesos argentins</div>
      <div class="hero-rate loading" id="hero-rate">—</div>
      <div class="hero-sub">
        <span class="hero-change neutral" id="hero-change">—</span>
        <span class="hero-time" id="hero-time">Chargement…</span>
      </div>
    </section>

    <!-- Currency Converter -->
    <div class="card converter-card">
      <div class="converter-inner">
        <div class="converter-header">
          <span class="converter-title">Convertisseur</span>
          <span class="converter-rate-badge" id="conv-rate-badge">Chargement…</span>
        </div>
        <div class="converter-inputs">
          <div class="converter-field">
            <div class="converter-label"><span class="flag">🇪🇺</span> EUR</div>
            <input id="conv-eur" class="converter-input" type="number" inputmode="decimal" placeholder="0.00" min="0" />
          </div>
          <button class="converter-swap" id="conv-swap" title="Inverser">⇄</button>
          <div class="converter-field">
            <div class="converter-label"><span class="flag">🇦🇷</span> ARS</div>
            <input id="conv-ars" class="converter-input" type="number" inputmode="decimal" placeholder="0" min="0" />
          </div>
        </div>
      </div>
    </div>

    <!-- Chart card -->
    <div class="card">
      <!-- Range selector -->
      <div class="range-bar" id="range-bar">
        <button class="range-btn active" data-range="1D">
          1J <span class="range-pct loading-pct" id="pct-1D">&nbsp;&nbsp;&nbsp;&nbsp;</span>
        </button>
        <button class="range-btn" data-range="1W">
          1S <span class="range-pct loading-pct" id="pct-1W">&nbsp;&nbsp;&nbsp;&nbsp;</span>
        </button>
        <button class="range-btn" data-range="1M">
          1M <span class="range-pct loading-pct" id="pct-1M">&nbsp;&nbsp;&nbsp;&nbsp;</span>
        </button>
        <button class="range-btn" data-range="3M">
          3M <span class="range-pct loading-pct" id="pct-3M">&nbsp;&nbsp;&nbsp;&nbsp;</span>
        </button>
        <button class="range-btn" data-range="6M">
          6M <span class="range-pct loading-pct" id="pct-6M">&nbsp;&nbsp;&nbsp;&nbsp;</span>
        </button>
        <button class="range-btn" data-range="1Y">
          1A <span class="range-pct loading-pct" id="pct-1Y">&nbsp;&nbsp;&nbsp;&nbsp;</span>
        </button>
      </div>

      <!-- Chart -->
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
        <canvas id="chart-drag-overlay"></canvas>
        <div class="chart-overlay visible" id="chart-overlay">
          <div class="spinner"></div>
        </div>
      </div>
      <!-- Two-point comparison result -->
      <div id="comparison-bar">
        <span class="cmp-label">Écart sélectionné :</span>
        <span class="cmp-chip" id="cmp-chip"></span>
        <span class="cmp-label" id="cmp-abs"></span>
      </div>
      <div class="cmp-hint" id="cmp-hint">🖱️ Glisse sur le graphique pour comparer deux points · 📱 Touche deux points simultanément</div>

      <!-- Stats -->
      <div class="stats-bar">
        <div class="stat-item">
          <div class="stat-label">Min</div>
          <div class="stat-value down" id="stat-min">—</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Max</div>
          <div class="stat-value up" id="stat-max">—</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Moy</div>
          <div class="stat-value" id="stat-avg">—</div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <span>Actualisé toutes les 15 min</span>
      <span class="footer-sep">|</span>
      <a href="/docs">Documentation API</a>
      <span class="footer-sep">|</span>
      <span id="footer-ts">—</span>
    </footer>

  </div>

  <div id="error-toast"></div>

  <script>
  (() => {
    'use strict';

    /* ── Config ── */
    const RANGES = {
      '1D': 1,
      '1W': 7,
      '1M': 30,
      '3M': 90,
      '6M': 180,
      '1Y': 365,
    };

    /* ── State ── */
    let allHistory = [];
    let currentRange = '1D';
    let chart = null;
    let refreshTimer = null;
    let currentRate = null;
    let currentChartPoints = [];

    /* ── DOM refs ── */
    const heroRate      = document.getElementById('hero-rate');
    const heroChange    = document.getElementById('hero-change');
    const heroTime      = document.getElementById('hero-time');
    const chartCanvas   = document.getElementById('chart');
    const dragCanvas    = document.getElementById('chart-drag-overlay');
    const chartOverlay  = document.getElementById('chart-overlay');
    const statMin       = document.getElementById('stat-min');
    const statMax       = document.getElementById('stat-max');
    const statAvg       = document.getElementById('stat-avg');
    const footerTs      = document.getElementById('footer-ts');
    const errorToast    = document.getElementById('error-toast');
    const rangeBtns     = document.querySelectorAll('.range-btn');
    const convEur       = document.getElementById('conv-eur');
    const convArs       = document.getElementById('conv-ars');
    const convSwap      = document.getElementById('conv-swap');
    const convBadge     = document.getElementById('conv-rate-badge');
    const compBar       = document.getElementById('comparison-bar');
    const cmpChip       = document.getElementById('cmp-chip');
    const cmpAbs        = document.getElementById('cmp-abs');
    const cmpHint       = document.getElementById('cmp-hint');

    /* ── Helpers ── */
    function fmtRate(r) {
      return new Intl.NumberFormat('fr-AR', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      }).format(r);
    }

    function fmtPct(pct, signed = true) {
      const abs = Math.abs(pct).toFixed(2);
      if (!signed) return abs + '%';
      return (pct >= 0 ? '+' : '−') + abs + '%';
    }

    function relativeTime(iso) {
      const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
      if (diff < 60)  return 'il y a quelques secondes';
      if (diff < 3600) {
        const m = Math.floor(diff / 60);
        return `il y a ${m} min${m > 1 ? 's' : ''}`;
      }
      const h = Math.floor(diff / 3600);
      return `il y a ${h} h`;
    }

    function showError(msg) {
      errorToast.textContent = msg;
      errorToast.classList.add('show');
      setTimeout(() => errorToast.classList.remove('show'), 4000);
    }

    function filterHistory(days) {
      if (!allHistory.length) return [];
      const cutoff = Date.now() - days * 86400000;
      const filtered = allHistory.filter(p => new Date(p.timestamp).getTime() >= cutoff);
      return filtered.length >= 2 ? filtered : allHistory.slice(-Math.min(2, allHistory.length));
    }

    function calcPct(points) {
      if (!points || points.length < 2) return null;
      const first = points[0].rate;
      const last  = points[points.length - 1].rate;
      return ((last - first) / first) * 100;
    }

    /* ── Detect dark mode for chart ── */
    const darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const C = {
      line:        darkMode ? '#2979ff' : '#1a5fff',
      gridLine:    darkMode ? 'rgba(255,255,255,0.06)' : 'rgba(10,10,46,0.06)',
      tickColor:   darkMode ? 'rgba(255,255,255,0.4)'  : 'rgba(10,10,46,0.4)',
      tooltipBg:   darkMode ? '#0d1333' : '#ffffff',
      tooltipText: darkMode ? '#ffffff' : '#0a0a2e',
      tooltipBorder: darkMode ? 'rgba(255,255,255,0.1)' : 'rgba(10,10,46,0.1)',
    };

    /* ── Chart init ── */
    function buildGradient(ctx, chartArea, isUp) {
      const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
      if (isUp) {
        gradient.addColorStop(0,   darkMode ? 'rgba(41,121,255,0.35)' : 'rgba(26,95,255,0.25)');
        gradient.addColorStop(0.7, darkMode ? 'rgba(41,121,255,0.08)' : 'rgba(26,95,255,0.06)');
        gradient.addColorStop(1,   'rgba(0,0,0,0)');
      } else {
        gradient.addColorStop(0,   darkMode ? 'rgba(255,23,68,0.25)'  : 'rgba(213,0,50,0.18)');
        gradient.addColorStop(0.7, darkMode ? 'rgba(255,23,68,0.06)'  : 'rgba(213,0,50,0.04)');
        gradient.addColorStop(1,   'rgba(0,0,0,0)');
      }
      return gradient;
    }

    function initChart(labels, values, isUp) {
      if (chart) chart.destroy();

      chartOverlay.classList.remove('visible');

      const ctx = chartCanvas.getContext('2d');

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data: values,
            borderColor: isUp
              ? (darkMode ? '#2979ff' : '#1a5fff')
              : (darkMode ? '#ff1744' : '#d50032'),
            borderWidth: 2.5,
            pointRadius: 0,
            pointHoverRadius: 6,
            pointHoverBackgroundColor: isUp
              ? (darkMode ? '#2979ff' : '#1a5fff')
              : (darkMode ? '#ff1744' : '#d50032'),
            pointHoverBorderColor: darkMode ? '#ffffff' : '#ffffff',
            pointHoverBorderWidth: 2,
            tension: 0.35,
            fill: true,
            backgroundColor(context) {
              const chart = context.chart;
              const { ctx: c, chartArea } = chart;
              if (!chartArea) return 'transparent';
              return buildGradient(c, chartArea, isUp);
            },
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          aspectRatio: window.innerWidth < 480 ? 1.8 : 2.8,
          animation: { duration: 600, easing: 'easeInOutQuart' },
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: C.tooltipBg,
              titleColor: C.tooltipText,
              bodyColor: C.tooltipText,
              borderColor: C.tooltipBorder,
              borderWidth: 1,
              padding: 12,
              cornerRadius: 12,
              titleFont: { size: 12, weight: '600' },
              bodyFont: { size: 15, weight: '800' },
              callbacks: {
                title(items) {
                  return items[0].label;
                },
                label(item) {
                  return ' ' + fmtRate(item.parsed.y) + ' ARS';
                },
              },
            },
          },
          scales: {
            x: {
              grid: { color: C.gridLine, drawBorder: false },
              ticks: {
                color: C.tickColor,
                font: { size: 11 },
                maxTicksLimit: window.innerWidth < 480 ? 4 : 6,
                maxRotation: 0,
              },
              border: { display: false },
            },
            y: {
              position: 'right',
              grid: { color: C.gridLine, drawBorder: false },
              ticks: {
                color: C.tickColor,
                font: { size: 11 },
                maxTicksLimit: 5,
                callback: v => fmtRate(v),
              },
              border: { display: false },
            },
          },
        },
      });
    }

    /* ── Converter logic ── */
    function updateConverter(rate) {
      currentRate = rate;
      convBadge.textContent = '1 € = ' + fmtRate(rate) + ' ARS';
    }

    convEur.addEventListener('input', () => {
      if (!currentRate) return;
      const v = parseFloat(convEur.value);
      convArs.value = isNaN(v) ? '' : Math.round(v * currentRate).toString();
    });

    convArs.addEventListener('input', () => {
      if (!currentRate) return;
      const v = parseFloat(convArs.value);
      convEur.value = isNaN(v) ? '' : (v / currentRate).toFixed(2);
    });

    convSwap.addEventListener('click', () => {
      const tmpE = convEur.value;
      const tmpA = convArs.value;
      convSwap.style.transform = 'rotate(360deg)';
      setTimeout(() => convSwap.style.transform = '', 400);
      convEur.value = tmpA && currentRate ? (parseFloat(tmpA) / currentRate).toFixed(2) : tmpA;
      convArs.value = tmpE && currentRate ? Math.round(parseFloat(tmpE) * currentRate).toString() : tmpE;
    });

    /* ── Two-point chart comparison ── */
    const dragCtx = dragCanvas.getContext('2d');

    function syncDragCanvas() {
      // Position dragCanvas exactly over chartCanvas (not chart-wrap)
      const chartRect = chartCanvas.getBoundingClientRect();
      const wrapRect  = chartCanvas.parentElement.getBoundingClientRect();
      const offLeft   = chartRect.left - wrapRect.left;
      const offTop    = chartRect.top  - wrapRect.top;
      const cssW      = chartRect.width;
      const cssH      = chartRect.height;
      dragCanvas.style.left   = offLeft + 'px';
      dragCanvas.style.top    = offTop  + 'px';
      dragCanvas.style.width  = cssW    + 'px';
      dragCanvas.style.height = cssH    + 'px';
      // Physical pixels (device pixel ratio)
      const dpr = window.devicePixelRatio || 1;
      dragCanvas.width  = Math.round(cssW * dpr);
      dragCanvas.height = Math.round(cssH * dpr);
      dragCtx.scale(dpr, dpr);
    }

    function getChartIndexFromX(clientX) {
      if (!chart || !currentChartPoints.length) return null;
      const rect  = chartCanvas.getBoundingClientRect();
      const relX  = clientX - rect.left;
      const area  = chart.chartArea;
      const pct   = Math.max(0, Math.min(1, (relX - area.left) / (area.right - area.left)));
      return Math.round(pct * (currentChartPoints.length - 1));
    }

    function drawCompareLines(idxA, idxB) {
      if (!chart) return;
      // syncDragCanvas resets the transform — must be called before drawing
      syncDragCanvas();

      const area = chart.chartArea;
      const n    = currentChartPoints.length;
      // chart.chartArea coords are in CSS pixels relative to chartCanvas
      // dragCanvas is now positioned & scaled to match chartCanvas exactly
      const xA   = area.left + (idxA / (n - 1)) * (area.right  - area.left);
      const xB   = area.left + (idxB / (n - 1)) * (area.right  - area.left);
      const rA   = currentChartPoints[idxA];
      const rB   = currentChartPoints[idxB];
      const yTop = chart.chartArea.top;
      const yBot = chart.chartArea.bottom;
      const yA   = chart.scales.y.getPixelForValue(rA);
      const yB   = chart.scales.y.getPixelForValue(rB);
      const isUp = rB >= rA;
      const col  = isUp
        ? (darkMode ? 'rgba(0,230,118,0.9)' : 'rgba(0,169,79,0.9)')
        : (darkMode ? 'rgba(255,23,68,0.9)'  : 'rgba(213,0,50,0.9)');

      // Clear (dragCanvas.width/height are physical px; scale() handles the rest)
      dragCtx.clearRect(0, 0, dragCanvas.width, dragCanvas.height);

      // Vertical dashed lines
      [xA, xB].forEach(x => {
        dragCtx.beginPath();
        dragCtx.setLineDash([5, 4]);
        dragCtx.strokeStyle = col;
        dragCtx.lineWidth = 1.5;
        dragCtx.moveTo(x, yTop);
        dragCtx.lineTo(x, yBot);
        dragCtx.stroke();
        dragCtx.setLineDash([]);
      });

      // Horizontal dashed connector at mid-height
      const yMid = (yA + yB) / 2;
      dragCtx.beginPath();
      dragCtx.strokeStyle = col;
      dragCtx.lineWidth = 1;
      dragCtx.setLineDash([3, 5]);
      dragCtx.moveTo(xA, yMid);
      dragCtx.lineTo(xB, yMid);
      dragCtx.stroke();
      dragCtx.setLineDash([]);

      // Dot markers on the line
      [{ x: xA, y: yA }, { x: xB, y: yB }].forEach(({ x, y }) => {
        dragCtx.beginPath();
        dragCtx.arc(x, y, 4, 0, Math.PI * 2);
        dragCtx.fillStyle = col;
        dragCtx.fill();
      });

      const diff = rB - rA;
      const pct  = (diff / rA) * 100;
      const sign = diff >= 0 ? '+' : '';
      const cls  = diff >= 0 ? 'up' : 'down';
      cmpChip.textContent = sign + pct.toFixed(2) + '%';
      cmpChip.className   = 'cmp-chip ' + cls;
      cmpAbs.textContent  = sign + fmtRate(Math.abs(diff)) + ' ARS';
      compBar.classList.add('visible');
    }

    function clearCompare() {
      if (dragCtx) dragCtx.clearRect(0, 0, dragCanvas.width, dragCanvas.height);
      compBar.classList.remove('visible');
    }

    /* Prevent text selection while dragging on chart */
    chartCanvas.addEventListener('selectstart', e => e.preventDefault());
    chartCanvas.addEventListener('mousedown',   e => e.preventDefault());

    /* Mouse drag */
    let dragStart = null;
    chartCanvas.addEventListener('mousedown', e => {
      e.preventDefault(); // already above, but belt-and-suspenders
      dragStart = getChartIndexFromX(e.clientX);
    });
    chartCanvas.addEventListener('mousemove', e => {
      if (dragStart === null) return;
      const idx = getChartIndexFromX(e.clientX);
      if (idx !== null && idx !== dragStart) drawCompareLines(dragStart, idx);
    });
    chartCanvas.addEventListener('mouseup', e => {
      const idx = getChartIndexFromX(e.clientX);
      if (dragStart !== null && idx !== null && idx !== dragStart) {
        drawCompareLines(dragStart, idx);
      } else {
        clearCompare();
      }
      dragStart = null;
    });
    chartCanvas.addEventListener('mouseleave', () => {
      dragStart = null;
    });

    /* Touch (2-finger pinch) */
    let touch1Idx = null, touch2Idx = null;
    chartCanvas.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        e.preventDefault();
        touch1Idx = getChartIndexFromX(e.touches[0].clientX);
        touch2Idx = getChartIndexFromX(e.touches[1].clientX);
        if (touch1Idx !== null && touch2Idx !== null)
          drawCompareLines(Math.min(touch1Idx, touch2Idx), Math.max(touch1Idx, touch2Idx));
      } else {
        clearCompare();
      }
    }, { passive: false });
    chartCanvas.addEventListener('touchmove', e => {
      if (e.touches.length === 2) {
        e.preventDefault();
        touch1Idx = getChartIndexFromX(e.touches[0].clientX);
        touch2Idx = getChartIndexFromX(e.touches[1].clientX);
        if (touch1Idx !== null && touch2Idx !== null)
          drawCompareLines(Math.min(touch1Idx, touch2Idx), Math.max(touch1Idx, touch2Idx));
      }
    }, { passive: false });
    chartCanvas.addEventListener('touchend', () => {
      touch1Idx = null; touch2Idx = null;
    });

    /* ── Format chart label ── */
    function fmtLabel(iso, days) {
      const d = new Date(iso);
      if (days <= 1) {
        return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      }
      if (days <= 7) {
        return d.toLocaleDateString('fr-FR', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
      }
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
    }

    /* ── Render chart for a range ── */
    function renderRange(range) {
      const days    = RANGES[range];
      const points  = filterHistory(days);
      const labels  = points.map(p => fmtLabel(p.timestamp, days));
      const values  = points.map(p => p.rate);
      const pct     = calcPct(points);
      const isUp    = pct === null ? true : pct >= 0;

      currentChartPoints = values;
      clearCompare();
      syncDragCanvas();

      if (points.length < 2) {
        if (!chart) {
          chartOverlay.classList.add('visible');
          chartOverlay.innerHTML = '<div class="chart-empty-msg">Données insuffisantes pour cette période</div>';
        }
      } else {
        chartOverlay.innerHTML = '<div class="spinner"></div>';
        initChart(labels, values, isUp);
        setTimeout(syncDragCanvas, 700); // after animation
      }

      /* Stats */
      if (values.length) {
        const min = Math.min(...values);
        const max = Math.max(...values);
        const avg = values.reduce((a, b) => a + b, 0) / values.length;
        statMin.textContent = fmtRate(min);
        statMax.textContent = fmtRate(max);
        statAvg.textContent = fmtRate(avg);
      }
    }

    /* ── Update percentage badges ── */
    function updateBadges() {
      Object.entries(RANGES).forEach(([key, days]) => {
        const el  = document.getElementById('pct-' + key);
        if (!el) return;
        const pts = filterHistory(days);
        const pct = calcPct(pts);

        el.classList.remove('loading-pct', 'up', 'down', 'neutral');

        if (pct === null || pts.length < 2) {
          el.textContent = '—';
          el.classList.add('neutral');
        } else if (pct >= 0) {
          el.textContent = fmtPct(pct);
          el.classList.add('up');
        } else {
          el.textContent = fmtPct(pct);
          el.classList.add('down');
        }
      });
    }

    /* ── Update hero ── */
    function updateHero(latest) {
      heroRate.classList.remove('loading');
      heroRate.textContent = fmtRate(latest.rate) + ' ';

      const pts1D = filterHistory(1);
      const pct   = calcPct(pts1D);

      heroChange.className = 'hero-change';
      if (pct === null) {
        heroChange.textContent = '—';
        heroChange.classList.add('neutral');
      } else if (pct >= 0) {
        const diff = latest.rate - pts1D[0].rate;
        heroChange.innerHTML = '▲ +' + fmtRate(diff) + ' (+' + Math.abs(pct).toFixed(2) + '%)';
        heroChange.classList.add('up');
      } else {
        const diff = pts1D[0].rate - latest.rate;
        heroChange.innerHTML = '▼ −' + fmtRate(diff) + ' (−' + Math.abs(pct).toFixed(2) + '%)';
        heroChange.classList.add('down');
      }

      heroTime.textContent = relativeTime(latest.timestamp);
      footerTs.textContent = 'Dernière MAJ : ' + new Date(latest.timestamp).toLocaleString('fr-FR', {
        day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
      });

      updateConverter(latest.rate);
    }

    /* ── Fetch & refresh ── */
    async function fetchData() {
      try {
        const [histRes, latestRes] = await Promise.all([
          fetch('/api/rate-history'),
          fetch('/api/latest-rate'),
        ]);

        if (!histRes.ok || !latestRes.ok) throw new Error('Erreur réseau');

        const histData   = await histRes.json();
        const latestData = await latestRes.json();

        if (!histData.ok || !latestData.ok) throw new Error('Données invalides');

        /* Sort history ascending by timestamp */
        allHistory = (histData.history || []).sort(
          (a, b) => new Date(a.timestamp) - new Date(b.timestamp)
        );

        /* Append latest if newer than last stored */
        if (allHistory.length === 0 || new Date(latestData.timestamp) > new Date(allHistory[allHistory.length - 1].timestamp)) {
          allHistory.push({ rate: latestData.rate, timestamp: latestData.timestamp });
        }

        updateHero(latestData);
        updateBadges();
        renderRange(currentRange);

      } catch (err) {
        showError('Erreur de chargement des données');
        chartOverlay.innerHTML = '<div class="chart-empty-msg">Impossible de charger les données</div>';
        chartOverlay.classList.add('visible');
        console.error(err);
      }
    }

    /* ── Range button click ── */
    rangeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        rangeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentRange = btn.dataset.range;
        renderRange(currentRange);
      });
    });

    /* ── Auto-refresh every 5 min ── */
    function scheduleRefresh() {
      if (refreshTimer) clearTimeout(refreshTimer);
      refreshTimer = setTimeout(async () => {
        await fetchData();
        scheduleRefresh();
      }, 5 * 60 * 1000);
    }

    /* ── Update relative time every minute ── */
    setInterval(() => {
      if (allHistory.length) {
        const last = allHistory[allHistory.length - 1];
        heroTime.textContent = relativeTime(last.timestamp);
      }
    }, 60000);

    /* ── Init ── */
    fetchData().then(scheduleRefresh);

  })();
  </script>
</body>
</html>
